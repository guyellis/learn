version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: 'America/Phoenix'
    open-pull-requests-limit: 99
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      mui:
        patterns:
          - "@mui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
